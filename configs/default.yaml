project:
  seed: 42
  root: "."

data:
  dataset: ml-latest-small        # ml-latest-small | ml-1m
  raw_dir: data/raw
  processed_dir: data/processed
  min_user_interactions: 5
  min_item_interactions: 1
  positive_threshold: 0           # 0 = every interaction is positive; 4 = rating >= 4 only

split:
  # leave_last_out: per-user last interaction = test, second-last = valid.
  # global: global timestamp cut, closer to production but far fewer test users.
  strategy: leave_last_out        # global | leave_last_out
  train_ratio: 0.8
  valid_ratio: 0.1
  negatives_per_positive: 4
  hard_negative_ratio: 0.5        # popularity-sampled vs uniform negatives

eval:
  k: 10
  tail_quantile: 0.8              # bottom 80% by train interaction count = long tail

recall:
  topk_per_source: 200
  popularity_decay: 0.0           # 0 = plain count; >0 = exp(-lambda * age)
  popularity_as_fallback: true    # popular backfills instead of competing in RRF
  min_primary_candidates: 50      # backfill when personalised recall returns fewer
  source_weights: {}              # optional per-source RRF weight, default 1.0
  itemcf:
    # Tuned on the VALID split only (scripts/tune_itemcf.py); see README table.
    top_n_neighbours: 20          # neighbours kept per item after similarity
    alpha: 0.5                    # 0.5 = cosine; 0 = raw co-occurrence; 1 = hard popularity penalty
    shrink: 0.0                   # denominator shrinkage for low-support pairs
    iuf: true                     # inverse user frequency weighting inside R
    min_cooccurrence: 1           # drop pairs with fewer RAW co-occurrences than this
    history_size: 100             # most recent TRAIN items used as user profile
    history_decay: 0.05           # exp(-decay * age_days) weight on history items
    cache: true                   # reuse artifacts/models/itemcf when train + params match
  two_tower:
    dim: 64
    hidden_dim: 128
    lr: 0.001
    weight_decay: 0.0001
    epochs: 50                    # upper bound; early stopping on valid Recall@10
    batch_size: 1024
    extra_negatives: 32           # per positive, in addition to in-batch negatives
    hard_negative_ratio: 0.5      # popularity^0.75 vs uniform extra negatives
    temperature: 0.1              # full-pipeline VALID winner; tau=0.2 wins standalone only
    history_size: 32              # strict prefix during training, full train history at eval
    dropout: 0.1
    eval_every: 5
    patience: 4
    cache: true
    backend: auto                 # auto: NumPy exact on macOS, FAISS elsewhere; or numpy | faiss
    index_type: flat              # flat = exact inner product; hnsw = approximate
    hnsw_m: 32
    hnsw_ef_construction: 80
    hnsw_ef_search: 64

mf:
  bpr:
    # Tuned on VALID only (scripts/tune_bpr.py).
    dim: 32
    lr: 0.01
    reg: 0.001
    epochs: 60                    # upper bound; early stopping on valid Recall@10
    batch_size: 8192
    negatives_per_positive: 4     # re-sampled every epoch, not frozen
    hard_negative_ratio: 0.0      # uniform negatives won on ml-latest-small (see README)
    eval_every: 5
    patience: 4                   # stop after 4 evaluations without improvement
    cache: true                   # reuse artifacts/models/bpr when train + params match

rank:
  model: none                    # none | deepfm | din (train with scripts/train_rank.py)
  snapshot_fraction: 0.75        # fit recall before this cutoff within TRAIN
  snapshot_bpr_epochs: 15
  snapshot_two_tower_epochs: 20
  negatives_per_user: 96
  dim: 16
  hidden_dim: 64
  history_size: 20
  popularity_half_life_days: 180.0
  epochs: 12
  patience: 4
  batch_size: 1024
  lr: 0.001

rerank:
  enabled: true
  lambda: 0.7                     # relevance weight in MMR

api:
  host: 127.0.0.1
  port: 8000
