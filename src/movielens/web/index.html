<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MovieLens 推荐系统</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --border: #e2e6eb; --text: #1f2328;
    --muted: #6b7280; --accent: #185fa5; --accent-soft: #e6f1fb; --ok: #0f6e56;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
  h1 { font-size: 22px; font-weight: 500; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .badge { margin-left: auto; font-size: 12px; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--card); color: var(--muted); }
  .badge.ok { color: var(--ok); border-color: #b7e0d2; background: #e1f5ee; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-top: 18px; }
  .controls { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  select, input[type=number] { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    background: #fff; color: var(--text); font-size: 14px; min-width: 130px; }
  input[type=range] { width: 160px; accent-color: var(--accent); }
  .switch { display: flex; align-items: center; gap: 7px; padding-bottom: 8px; font-size: 13px; }
  button { border: 0; border-radius: 8px; background: var(--accent); color: #fff;
    padding: 9px 20px; font-size: 14px; cursor: pointer; }
  button:hover { opacity: .9; }
  button:disabled { opacity: .5; cursor: default; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(260px, 1fr); gap: 18px; margin-top: 18px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  h2 { font-size: 14px; font-weight: 500; margin: 0 0 14px; }
  .card-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .card-item:last-child { border-bottom: 0; }
  .rank { width: 26px; height: 26px; flex: none; border-radius: 7px; background: var(--accent-soft);
    color: var(--accent); text-align: center; line-height: 26px; font-size: 12px; }
  .title { font-weight: 500; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .tag { display: inline-block; font-size: 11px; border: 1px solid var(--border); border-radius: 5px;
    padding: 1px 6px; margin: 3px 4px 0 0; color: var(--muted); }
  .src { margin-left: auto; font-size: 11px; color: var(--accent); white-space: nowrap; }
  .kv { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; }
  .kv span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 0; border-bottom: 1px solid var(--border); }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .err { color: #a32d2d; font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MovieLens 推荐系统</h1>
    <span class="sub">召回 → 精排 → MMR 重排 · 时序切分 · 全链路过滤已看</span>
    <span class="badge" id="status">连接中</span>
  </header>

  <div class="panel">
    <div class="controls">
      <div><label for="userSel">示例用户</label><select id="userSel"></select></div>
      <div><label for="userId">或输入 userId</label><input type="number" id="userId" min="1" style="width:130px"></div>
      <div><label for="k">推荐条数 K</label><input type="number" id="k" value="10" min="1" max="50"></div>
      <div><label for="lam">多样性权重 1−λ（λ = <span id="lamVal">0.7</span>）</label><input type="range" id="lam" min="0" max="1" step="0.05" value="0.7"></div>
      <label class="switch"><input type="checkbox" id="rerank" checked> 启用 MMR 重排</label>
      <button id="go">获取推荐</button>
    </div>
    <div class="hint" id="explain">当前仅启用热门召回基线；ItemCF / BPR / 双塔 / DIN 为后续阶段的接口占位。</div>
    <div class="err" id="err"></div>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>推荐结果</h2>
      <div id="items"><div class="hint">点击「获取推荐」开始。</div></div>
    </div>
    <div>
      <div class="panel">
        <h2>本次耗时</h2>
        <div id="latency"><div class="hint">暂无数据</div></div>
      </div>
      <div class="panel">
        <h2>离线指标（test 集）</h2>
        <table id="metrics"><tr><td class="hint">未评估</td></tr></table>
      </div>
      <div class="panel">
        <h2>链路阶段</h2>
        <div id="stages"><div class="hint">暂无数据</div></div>
      </div>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

function renderKV(el, pairs) {
  el.innerHTML = pairs.length
    ? pairs.map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join('')
    : '<div class="hint">暂无数据</div>';
}

async function init() {
  try {
    const h = await getJSON('/health');
    $('status').textContent = h.ready ? `已就绪 · ${h.n_users} 用户 / ${h.n_items} 电影` : '数据未准备';
    $('status').className = 'badge' + (h.ready ? ' ok' : '');
    if (h.stages) {
      const rows = [];
      for (const group of ['recall', 'rank']) {
        for (const s of h.stages[group]) rows.push([`${group}: ${s.name}`, s.implemented ? '已实现' : '待实现']);
      }
      rows.push(['rerank: mmr', h.stages.rerank.implemented ? '已实现' : '待实现']);
      renderKV($('stages'), rows);
    }
    const us = await getJSON('/users?limit=30');
    $('userSel').innerHTML = us.user_ids.map(u => `<option value="${u}">userId ${u}</option>`).join('');
    $('userId').value = us.user_ids[0] || 1;
    const m = await getJSON('/metrics');
    if (m.status === 'not_evaluated') {
      $('metrics').innerHTML = '<tr><td class="hint">运行 scripts/evaluate.py 后显示</td></tr>';
    } else {
      const t = m.test || m;
      const pairs = Object.entries(t).filter(([k]) => typeof t[k] === 'number');
      $('metrics').innerHTML = pairs.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${Number(v).toFixed(4)}</td></tr>`).join('');
    }
  } catch (e) { $('status').textContent = '服务未连接'; $('err').textContent = e.message; }
}

$('userSel').addEventListener('change', () => { $('userId').value = $('userSel').value; });
$('lam').addEventListener('input', () => { $('lamVal').textContent = $('lam').value; });

$('go').addEventListener('click', async () => {
  const btn = $('go'); btn.disabled = true; $('err').textContent = '';
  $('items').innerHTML = '<div class="hint">请求中…</div>';
  const uid = $('userId').value || $('userSel').value || 1;
  const params = new URLSearchParams({ k: $('k').value, use_rerank: $('rerank').checked, lam: $('lam').value });
  try {
    const data = await getJSON(`/recommend/${encodeURIComponent(uid)}?${params}`);
    $('items').innerHTML = data.items.length ? data.items.map((it, i) => `
      <div class="card-item">
        <div class="rank">${i + 1}</div>
        <div style="min-width:0">
          <div class="title">${esc(it.title)}</div>
          <div class="meta">movieId ${it.movie_id} · 分数 ${it.score.toFixed(5)} · ${esc(it.reason)}</div>
          <div>${(it.genres || []).map(g => `<span class="tag">${esc(g)}</span>`).join('')}</div>
        </div>
        <div class="src">${esc(it.source)}</div>
      </div>`).join('') : '<div class="hint">没有可推荐的电影</div>';
    const l = data.latency_ms;
    renderKV($('latency'), [
      ['召回', l.recall_ms + ' ms'], ['精排', l.rank_ms + ' ms'],
      ['重排', l.rerank_ms + ' ms'], ['总计', l.total_ms + ' ms'],
      ['候选数', l.n_candidates], ['冷启动', data.cold_start ? '是（热门兜底）' : '否']
    ]);
  } catch (e) {
    $('err').textContent = e.message;
    $('items').innerHTML = '<div class="hint">请求失败</div>';
  } finally { btn.disabled = false; }
});

init();
</script>
</body>
</html>
